<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" fill="none" role="img" aria-label="AI automated bidding for Freelancer.com">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="750" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="0.55" stop-color="#4c1d95"/>
      <stop offset="1" stop-color="#86198f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e879f9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e879f9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>
  <circle cx="930" cy="180" r="320" fill="url(#glow)"/>
  <circle cx="240" cy="620" r="260" fill="url(#glow)" opacity="0.6"/>

  <!-- Neural / AI nodes with connecting bid lines -->
  <g stroke="url(#accent)" stroke-width="2" opacity="0.7">
    <line x1="220" y1="240" x2="420" y2="330"/>
    <line x1="220" y1="240" x2="400" y2="150"/>
    <line x1="420" y1="330" x2="620" y2="270"/>
    <line x1="400" y1="150" x2="620" y2="270"/>
    <line x1="620" y1="270" x2="820" y2="200"/>
    <line x1="620" y1="270" x2="800" y2="400"/>
  </g>
  <g fill="url(#accent)">
    <circle cx="220" cy="240" r="12"/>
    <circle cx="400" cy="150" r="9"/>
    <circle cx="420" cy="330" r="10"/>
    <circle cx="620" cy="270" r="16"/>
    <circle cx="820" cy="200" r="9"/>
    <circle cx="800" cy="400" r="11"/>
  </g>

  <!-- Central "AI" chip -->
  <g>
    <rect x="528" y="196" width="150" height="150" rx="28" fill="#0f0a2e" stroke="url(#accent)" stroke-width="3"/>
    <text x="603" y="296" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="800" fill="url(#accent)" text-anchor="middle">AI</text>
    <g stroke="url(#accent)" stroke-width="3" opacity="0.8">
      <line x1="528" y1="236" x2="500" y2="236"/>
      <line x1="528" y1="286" x2="500" y2="286"/>
      <line x1="678" y1="236" x2="706" y2="236"/>
      <line x1="678" y1="286" x2="706" y2="286"/>
      <line x1="568" y1="196" x2="568" y2="168"/>
      <line x1="638" y1="196" x2="638" y2="168"/>
    </g>
  </g>

  <!-- Bid proposal cards being auto-submitted -->
  <g>
    <rect x="470" y="470" width="180" height="110" rx="14" fill="#ffffff" opacity="0.95"/>
    <rect x="492" y="494" width="110" height="12" rx="6" fill="#4c1d95"/>
    <rect x="492" y="518" width="136" height="8" rx="4" fill="#a78bfa"/>
    <rect x="492" y="536" width="120" height="8" rx="4" fill="#c4b5fd"/>
    <rect x="492" y="556" width="60" height="12" rx="6" fill="#86198f"/>

    <rect x="628" y="448" width="180" height="110" rx="14" fill="#ffffff" opacity="0.75"/>
    <rect x="650" y="472" width="110" height="12" rx="6" fill="#4c1d95"/>
    <rect x="650" y="496" width="136" height="8" rx="4" fill="#a78bfa"/>
    <rect x="650" y="514" width="120" height="8" rx="4" fill="#c4b5fd"/>
    <rect x="650" y="534" width="60" height="12" rx="6" fill="#86198f"/>
  </g>

  <!-- Labels -->
  <text x="80" y="110" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#ffffff">AI Automated Bidding</text>
  <text x="80" y="152" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#e9d5ff">freelancer.com &#183; auto-generated proposals</text>
</svg>
